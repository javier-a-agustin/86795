name: Deploy
on:
  push:
    branches: [main]
permissions:
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Generar config.js desde los secrets
        run: |
          cat > js/config.js <<EOF
          const AIRTABLE_BASE = "${{ secrets.AIRTABLE_BASE }}";
          const AIRTABLE_TABLE = "${{ secrets.AIRTABLE_TABLE }}";
          const AIRTABLE_TOKEN = "${{ secrets.AIRTABLE_TOKEN }}";
          EOF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
